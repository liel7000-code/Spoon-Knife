<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1116">
  <title>Drift Game</title>
</head>
<body>
  <canvas id="scene" aria-label="Drift Game"></canvas>

  <!-- Main menu -->
  <section id="menu" class="screen">
    <div class="menu-card">
      <h1 class="logo" dir="ltr">DRIFT<span>GAME</span></h1>
      <p class="sub">מרוץ אינסופי בכביש המהיר. חתכו בין המכוניות, אל תיגעו באף אחת.</p>
      <div class="menu-car">
        <span class="lbl">הרכב שלך</span>
        <strong id="menuCar" dir="ltr">Toyota Supra</strong>
      </div>
      <div class="menu-btns">
        <button id="btnStart" class="btn primary">התחל לנסוע</button>
        <button id="btnGarage" class="btn">בחירת רכב</button>
        <button id="btnCamPref" class="btn ghost">מצלמה: גוף שלישי</button>
        <button id="btnMuteMenu" class="btn ghost">צליל: פועל</button>
      </div>
      <div class="menu-best">שיא: <b id="menuBest" dir="ltr">0</b></div>
      <div class="keys">
        <span><kbd>A</kbd>/<kbd>D</kbd> או חצים: החלפת נתיב</span>
        <span><kbd>W</kbd>/<kbd>S</kbd>: גז ובלם</span>
        <span><kbd>C</kbd>: מצלמה</span>
      </div>
    </div>
  </section>

  <!-- Garage / showroom -->
  <section id="garage" class="screen" hidden>
    <header class="garage-top">
      <button id="garageBack" class="btn ghost small">חזרה</button>
      <h2>בחירת רכב</h2>
      <span class="count" id="carCount">1 מתוך 3</span>
    </header>
    <div class="garage-nav" dir="ltr">
      <button id="prevCar" class="arrow" aria-label="רכב קודם">‹</button>
      <button id="nextCar" class="arrow" aria-label="רכב הבא">›</button>
    </div>
    <div class="garage-panel">
      <div class="car-title">
        <h3 id="carName" dir="ltr">Toyota Supra</h3>
        <p id="carTag"></p>
      </div>
      <div class="stats">
        <div class="stat"><span>מהירות מרבית</span><div class="bar"><i id="barTop"></i></div><b id="valTop" dir="ltr">0</b></div>
        <div class="stat"><span>תאוצה</span><div class="bar"><i id="barAcc"></i></div><b id="valAcc" dir="ltr">0</b></div>
        <div class="stat"><span>היגוי</span><div class="bar"><i id="barHan"></i></div><b id="valHan" dir="ltr">0</b></div>
      </div>
      <div class="colors">
        <span class="lbl">צבע</span>
        <div id="swatches" class="swatches"></div>
        <label class="picker" title="צבע מותאם">
          <input type="color" id="colorPick" value="#d6281f" aria-label="צבע מותאם">
        </label>
      </div>
      <button id="garageStart" class="btn primary">התחל</button>
    </div>
  </section>

  <!-- HUD -->
  <section id="hud" hidden>
    <div class="hud-top">
      <div class="hud-box score">
        <span class="lbl">ניקוד</span>
        <b id="hudScore" dir="ltr">0</b>
        <span class="best">שיא <b id="hudBest" dir="ltr">0</b></span>
      </div>
      <div class="hud-tools">
        <button id="btnCam" class="tool" aria-label="החלף מצלמה">מצלמה</button>
        <button id="btnMute" class="tool" aria-label="השתק">צליל</button>
      </div>
    </div>
    <div id="combo" class="combo" hidden>
      <span>קומבו</span><b id="comboVal" dir="ltr">×1</b>
      <div class="combo-bar"><i id="comboBar"></i></div>
    </div>
    <div id="popup" class="popup"></div>
    <div class="speedo">
      <b id="hudSpeed" dir="ltr">0</b>
      <span>קמ״ש</span>
    </div>
  </section>

  <!-- Touch controls (physical left/right, so LTR) -->
  <div id="touch" dir="ltr" hidden>
    <div class="tgroup">
      <button data-act="left" aria-label="נתיב שמאלה">◀</button>
      <button data-act="right" aria-label="נתיב ימינה">▶</button>
    </div>
    <div class="tgroup">
      <button data-act="brake" aria-label="בלם">▼</button>
      <button data-act="gas" aria-label="גז">▲</button>
    </div>
  </div>

  <!-- Game over -->
  <section id="over" class="screen" hidden>
    <div class="menu-card over-card">
      <h2>התרסקת!</h2>
      <div id="newRecord" class="record" hidden>שיא חדש</div>
      <div class="over-stats">
        <div><span class="lbl">ניקוד</span><b id="overScore" dir="ltr">0</b></div>
        <div><span class="lbl">מרחק</span><b id="overDist">0</b></div>
        <div><span class="lbl">כמעט־פגיעות</span><b id="overNear" dir="ltr">0</b></div>
        <div><span class="lbl">שיא</span><b id="overBest" dir="ltr">0</b></div>
      </div>
      <div class="menu-btns">
        <button id="btnRetry" class="btn primary">שחק שוב</button>
        <button id="btnMenu" class="btn">תפריט</button>
      </div>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
